<title>Rosario Balladares</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: a hero sentence with coloured pills (her reference), a grid of
   numbered project covers, a full-screen case that opens on click, contact.
   Single warm look on purpose: cream paper, plum ink, her orange and lilac. */
:root {
  --paper: #F7F0E4;     /* cream ground */
  --paper-2: #EFE5D4;   /* a shade deeper: image wells, hovers */
  --card: #FFFDF8;      /* the white pill */
  --ink: #2B1726;       /* plum-black text */
  --ink-soft: #6E5A66;  /* secondary text */
  --plum: #6A2A5C;      /* from her deck */
  --orange: #E8511E;    /* from her RB logo, approximate */
  --lilac: #C4B5DC;     /* from her RB logo, approximate */
  --line: #DCCDBA;
  --display: "Lora", "Iowan Old Style", Georgia, serif;
  --text: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--paper); color: var(--ink); font: 400 17px/1.55 var(--text); overflow-x: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1440px; margin: 0 auto;
}
@media (min-width: 900px) {
  .wrap { padding-left: max(48px, env(safe-area-inset-left, 0px)); padding-right: max(48px, env(safe-area-inset-right, 0px)); }
}
.label { font: 600 12px/1.2 var(--text); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }

/* ---------- top bar ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
.logo { display: block; height: 32px; width: auto; flex: none; }
.brand .label { color: var(--plum); white-space: nowrap; }
.bar-right { display: flex; align-items: center; gap: 20px; }
.bar nav { display: flex; gap: 20px; }
.bar nav a { font-weight: 500; font-size: 15px; text-decoration: none; }
.bar nav a:hover { color: var(--orange); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 2px; background: var(--card); }
.lang button { border: 0; background: none; border-radius: 99px; padding: 5px 10px; font-size: 13px; font-weight: 600; letter-spacing: .06em; cursor: pointer; color: var(--ink-soft); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
@media (max-width: 640px) {
  .bar nav, .brand .label { display: none; }
}

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; }
.glow {
  position: absolute; width: 44vmax; height: 44vmax; left: 0; top: 0; border-radius: 50%;
  background: radial-gradient(circle, var(--lilac) 0%, color-mix(in srgb, var(--lilac) 35%, transparent) 40%, transparent 70%);
  pointer-events: none; opacity: .7; transform: translate(45vw, -8vmax); will-change: transform;
}
.hero .wrap { position: relative; padding-block: 48px 64px; display: grid; gap: 28px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-soft); }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 4px color-mix(in srgb, var(--orange) 20%, transparent); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--orange) 0%, transparent); } }
.hero h1 {
  margin: 0; font: 400 clamp(38px, 6.2vw, 92px)/1.14 var(--display);
  letter-spacing: -.025em; max-width: 15em;
}
.hero h1 .line { display: block; }
.pill {
  display: inline-block; vertical-align: .08em;
  font: 500 .6em/1 var(--display); letter-spacing: -.01em;
  padding: .32em .62em .38em; border-radius: 99px; margin-inline: .08em;
  transition: transform .35s cubic-bezier(.2,.8,.2,1);
  will-change: transform;
}
.pill.name { background: var(--card); box-shadow: 0 10px 30px -14px rgba(43, 23, 38, .35); }
.pill.dark { background: var(--plum); color: var(--paper); }
.pill.hot { background: var(--orange); color: #fff; }
.pill.out { border: 1.5px solid var(--ink); }
.hero h1 em { font-style: italic; color: var(--plum); }
.hero .sub { margin: 0; max-width: 46ch; font-size: clamp(17px, 1.5vw, 20px); color: var(--ink-soft); }
.cta {
  justify-self: start; display: inline-flex; align-items: center; gap: 14px;
  background: var(--lilac); border-radius: 99px; padding: 8px 8px 8px 22px;
  text-decoration: none; font-weight: 600;
  box-shadow: 0 12px 30px -14px color-mix(in srgb, var(--plum) 70%, transparent);
  transition: transform .2s;
}
.cta span { width: 36px; height: 36px; border-radius: 50%; background: var(--card); display: grid; place-items: center; transition: transform .2s; }
.cta:hover { transform: translateY(-2px); }
.cta:hover span { transform: rotate(45deg); }
@media (min-width: 900px) { .hero .wrap { padding-block: 88px 96px; gap: 32px; } }

/* ---------- work grid ---------- */
.work { padding-block: 24px 80px; display: grid; gap: 28px; }
.work-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--ink); padding-bottom: 12px; }
.work-head h2 { margin: 0; font: 400 clamp(30px, 3.6vw, 52px)/1 var(--display); letter-spacing: -.02em; }
.grid { display: grid; gap: 40px 28px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .grid { grid-template-columns: 1fr 1fr; } }
.card { all: unset; cursor: pointer; display: grid; gap: 14px; min-width: 0; }
.card:focus-visible { outline: 2px solid var(--orange); outline-offset: 6px; border-radius: 8px; }
.cover { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--paper-2); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .7s cubic-bezier(.2,.8,.2,1); }
.cover .open {
  position: absolute; right: 14px; bottom: 14px; background: var(--card); border-radius: 99px;
  padding: 8px 14px; font-size: 14px; font-weight: 600; opacity: 0; transform: translateY(8px);
  transition: opacity .25s, transform .25s;
}
.card:hover .cover img, .card:focus-visible .cover img { transform: scale(1.04); }
.card:hover .open, .card:focus-visible .open { opacity: 1; transform: none; }
.card-meta { display: grid; grid-template-columns: 3.2ch 1fr; gap: 4px 12px; align-items: baseline; }
.card-meta .num { font: 600 13px/1 var(--text); color: var(--orange); font-variant-numeric: tabular-nums; }
.card-meta h3 { margin: 0; font: 500 clamp(24px, 2.4vw, 32px)/1.1 var(--display); letter-spacing: -.015em; }
.card-meta p { grid-column: 2; margin: 0; font-size: 15px; color: var(--ink-soft); }
.motion-cover { background: var(--plum); display: grid; place-content: center; text-align: center; color: var(--paper); }
.motion-cover .word { font: italic 400 clamp(36px, 5vw, 64px)/1 var(--display); }
.motion-cover .orbit { position: absolute; width: 34%; aspect-ratio: 1; border-radius: 50%; border: 1.5px solid var(--orange); left: 50%; top: 50%; animation: orbit 9s linear infinite; }
@keyframes orbit { from { transform: translate(-50%, -50%) rotate(0) translateX(55%); } to { transform: translate(-50%, -50%) rotate(360deg) translateX(55%); } }

/* ---------- case view ---------- */
dialog.case {
  width: 100%; max-width: 100%; height: 100%; max-height: 100%; margin: 0; padding: 0; border: 0;
  background: var(--paper); color: var(--ink); overflow-y: auto; overscroll-behavior: contain;
}
dialog.case::backdrop { background: var(--plum); }
dialog.case[open] { animation: rise .45s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { transform: translateY(24px); opacity: .4; } }
.case-bar { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.case-bar .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 12px; }
.pill-btn { border: 1px solid var(--ink); background: var(--card); border-radius: 99px; padding: 8px 16px; font-weight: 600; font-size: 14px; cursor: pointer; }
.pill-btn:hover { background: var(--ink); color: var(--paper); }
.case-body { padding-block: 40px 80px; display: grid; gap: 48px; }
.case-head { display: grid; gap: 18px; }
.case-head .kicker { display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; }
.case-head .kicker .num { font: 600 13px/1 var(--text); color: var(--orange); }
.case-head h2 { margin: 0; font: 400 clamp(40px, 6vw, 88px)/1.02 var(--display); letter-spacing: -.03em; max-width: 14em; text-wrap: balance; }
.case-head h2 em { font-style: italic; color: var(--plum); }
.overview { display: grid; gap: 28px; }
.overview .paras { display: grid; gap: 14px; max-width: 60ch; font-size: clamp(17px, 1.4vw, 20px); }
.overview .paras p { margin: 0; }
.facts { display: grid; gap: 16px; align-content: start; margin: 0; }
.facts div { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; }
.facts dt { font: 600 12px/1.2 var(--text); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.facts dd { margin: 0; }
@media (min-width: 900px) { .overview { grid-template-columns: 7fr 4fr; gap: 64px; } }
.shot { margin: 0; border-radius: 8px; overflow: hidden; background: var(--paper-2); }
.shot img, .shot video { display: block; width: 100%; height: auto; }
.section { display: grid; gap: 20px; border-top: 1px solid var(--ink); padding-top: 24px; }
.section .label { color: var(--orange); }
.section h3 { margin: 0; font: 400 clamp(30px, 3.4vw, 48px)/1.08 var(--display); letter-spacing: -.02em; max-width: 18em; }
.section .paras { display: grid; gap: 12px; max-width: 62ch; }
.section .paras p { margin: 0; }
.items { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.item { background: var(--card); border-radius: 8px; padding: 18px; display: grid; gap: 8px; align-content: start; }
.item .k { font: 600 12px/1.2 var(--text); letter-spacing: .14em; text-transform: uppercase; color: var(--plum); }
.item .h { font: 500 19px/1.3 var(--display); }
.item p { margin: 0; font-size: 15px; color: var(--ink-soft); }
.outcome { background: var(--plum); color: var(--paper); border-radius: 8px; padding: clamp(24px, 4vw, 48px); display: grid; gap: 10px; }
.outcome .label { color: var(--lilac); }
.outcome p { margin: 0; font: 400 clamp(24px, 2.8vw, 38px)/1.25 var(--display); max-width: 30ch; }
.gallery { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .gallery { grid-template-columns: 1fr 1fr; } .gallery .shot.wide { grid-column: 1 / -1; } }
.next { all: unset; cursor: pointer; display: grid; gap: 6px; border-top: 1px solid var(--ink); padding-top: 20px; }
.next .h { font: 400 clamp(32px, 4.4vw, 64px)/1 var(--display); letter-spacing: -.02em; }
.next:hover .h { color: var(--orange); font-style: italic; }

/* ---------- contact ---------- */
.contact { background: var(--plum); color: var(--paper); }
.contact .wrap { padding-block: 72px 48px; display: grid; gap: 40px; }
.contact .label { color: var(--lilac); }
.contact h2 { margin: 0; font: 400 clamp(48px, 9vw, 140px)/.95 var(--display); letter-spacing: -.035em; }
.contact h2 em { color: var(--lilac); }
.links { display: grid; border-top: 1px solid color-mix(in srgb, var(--paper) 30%, transparent); }
.links a {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-block: 18px; text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--paper) 30%, transparent); font: 400 clamp(22px, 2.6vw, 34px)/1.1 var(--display);
  transition: padding .2s, color .2s;
}
.links a span:last-child { font: 500 14px/1 var(--text); color: var(--lilac); overflow-wrap: anywhere; text-align: right; }
.links a:hover { color: var(--orange); padding-left: 8px; }
.contact .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--lilac); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .glow, .pill { transform: none !important; }
  .status::before, .motion-cover .orbit, dialog.case[open] { animation: none; }
}
</style>
</head>

const pad = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
let lang = "es";
try { lang = localStorage.getItem("rb-lang") || (navigator.language || "es").slice(0, 2); } catch (e) {}
if (!UI[lang]) lang = "es";

const grid = document.getElementById("grid");
const dlg = document.getElementById("case");
const body = document.getElementById("case-body");
const imgsOf = p => (p.img && IMGS[p.img]) || [];
let current = -1;

function coverHTML(p) {
  const list = p.poster ? [p.poster] : imgsOf(p);
  if (!list.length) {
    return `<div class="cover motion-cover"><span class="orbit" aria-hidden="true"></span><span class="word">${p.motion ? "Motion" : esc(p.client)}</span></div>`;
  }
  return `<div class="cover"><img src="${list[0]}" alt="" loading="lazy"><span class="open">${UI[lang].open} ↗</span></div>`;
}

function renderGrid() {
  grid.innerHTML = "";
  P.forEach((p, i) => {
    const t = p[lang];
    const b = document.createElement("button");
    b.type = "button"; b.className = "card"; b.id = "card-" + p.id;
    b.setAttribute("aria-label", `${UI[lang].open}: ${p.client}`);
    b.innerHTML = coverHTML(p) +
      `<div class="card-meta"><span class="num">${pad(i + 1)}</span><h3>${esc(p.client)}</h3><p>${esc(t.field)} · ${esc(t.short)}</p></div>`;
    b.addEventListener("click", () => { location.hash = p.id; });
    grid.appendChild(b);
  });
  document.getElementById("work-count").textContent = `${pad(P.length)} ${UI[lang].projects}`;
}

function renderCase(i) {
  const p = P[i], t = p[lang], u = UI[lang];
  const list = imgsOf(p);
  const shot = (src, wide) => `<figure class="shot${wide ? " wide" : ""}"><img src="${src}" alt="${esc(p.client)}" loading="lazy"></figure>`;
  let html = `<header class="case-head">
      <div class="kicker"><span class="num">${pad(i + 1)} / ${pad(P.length)}</span><span class="label">${esc(p.client)} · ${esc(t.field)}</span></div>
      <h2 id="case-title">${esc(t.title)}</h2>
    </header>
    <div class="overview">
      <div class="paras">${t.overview.map(x => `<p>${esc(x)}</p>`).join("")}</div>
      <dl class="facts">${t.facts.map(([k, v]) => `<div><dt>${u[k]}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
    </div>`;
  if (list[0]) html += shot(list[0], true);
  if (p.video) html += `<figure class="shot wide"><video src="${p.video}" poster="${p.poster}" controls playsinline preload="metadata"></video></figure>`;
  let k = 1;
  (t.sections || []).forEach(s => {
    html += `<section class="section"><span class="label">${esc(s.n)}</span><h3>${esc(s.title)}</h3>
      ${s.paras ? `<div class="paras">${s.paras.map(x => `<p>${esc(x)}</p>`).join("")}</div>` : ""}
      ${s.items ? `<div class="items">${s.items.map(([key, h, d]) => `<div class="item"><span class="k">${esc(key)}</span>${d ? `<span class="h">${esc(h)}</span><p>${esc(d)}</p>` : `<p>${esc(h)}</p>`}</div>`).join("")}</div>` : ""}
    </section>`;
    if (list[k]) { html += shot(list[k], true); k++; }
  });
  if (t.outcome) html += `<div class="outcome"><span class="label">${u.outcome}</span><p>${esc(t.outcome)}</p></div>`;
  const rest = list.slice(k);
  if (rest.length) html += `<div class="gallery">${rest.map((s, j) => shot(s, rest.length % 2 === 1 && j === rest.length - 1)).join("")}</div>`;
  const n = P[(i + 1) % P.length];
  html += `<button type="button" class="next" id="case-next"><span class="label">${u.next}</span><span class="h">${esc(n.client)} →</span></button>`;
  body.innerHTML = html;
  document.getElementById("case-crumb").textContent = `${pad(i + 1)} · ${p.client}`;
  document.getElementById("case-close").textContent = u.close;
  document.getElementById("case-next").addEventListener("click", () => { location.hash = n.id; });
}

function openFromHash() {
  const i = P.findIndex(p => p.id === location.hash.slice(1));
  if (i < 0) {
    if (dlg.open) { dlg.close(); document.documentElement.style.overflow = ""; }
    if (current >= 0) { const c = document.getElementById("card-" + P[current].id); if (c) c.focus({ preventScroll: true }); }
    current = -1; return;
  }
  current = i; renderCase(i);
  if (!dlg.open) { dlg.showModal(); document.documentElement.style.overflow = "hidden"; }
  dlg.scrollTop = 0;
}
function closeCase() {
  if (location.hash) history.pushState(null, "", location.pathname + location.search);
  openFromHash();
}
document.getElementById("case-close").addEventListener("click", closeCase);
dlg.addEventListener("cancel", e => { e.preventDefault(); closeCase(); });
addEventListener("hashchange", openFromHash);

function setLang(l) {
  lang = l;
  try { localStorage.setItem("rb-lang", l); } catch (e) {}
  document.documentElement.lang = l;
  const u = UI[l];
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = u[el.dataset.t]; });
  document.getElementById("hero-title").innerHTML = u.hero;
  document.getElementById("contact-title").innerHTML = u.contact;
  document.getElementById("cv-link").href = u.cv;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  renderGrid();
  if (dlg.open && current >= 0) renderCase(current);
  bindPills();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* Mouse: the lilac glow trails the cursor; the pills lean toward it. */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
const hero = document.querySelector(".hero"), glow = document.getElementById("glow");
let gx = innerWidth * .45, gy = -innerHeight * .1, tx = gx, ty = gy, mx = -1e4, my = -1e4, pills = [];
function bindPills() { pills = [...document.querySelectorAll(".hero .pill")]; }
hero.addEventListener("pointermove", e => {
  const r = hero.getBoundingClientRect();
  tx = e.clientX - r.left - glow.offsetWidth / 2; ty = e.clientY - r.top - glow.offsetHeight / 2;
  mx = e.clientX; my = e.clientY;
});
hero.addEventListener("pointerleave", () => { mx = my = -1e4; });
function frame() {
  if (!reduce) {
    gx += (tx - gx) * .08; gy += (ty - gy) * .08;
    glow.style.transform = `translate(${gx}px, ${gy}px)`;
    if (fine) pills.forEach(el => {
      const r = el.getBoundingClientRect();
      const dx = mx - (r.left + r.width / 2), dy = my - (r.top + r.height / 2);
      const d = Math.hypot(dx, dy), f = d < 260 ? (1 - d / 260) : 0;
      el.style.transform = `translate(${dx * f * .12}px, ${dy * f * .12}px) rotate(${dx * f * .01}deg)`;
    });
  }
  requestAnimationFrame(frame);
}

setLang(lang);
openFromHash();
requestAnimationFrame(frame);
</script>
